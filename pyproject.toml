[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e57-fusion-viewer"
version = "0.8.0"
description = "Viewer for overlaying E57 point clouds and calibrated images"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "Pillow>=10.0", "PySide6>=6.6"]

[tool.setuptools.packages.find]
where = ["src"]
